[versions]
java = "21"
springBoot = "3.5.5"
springDependencyManagement = "1.1.7"
archunit = "1.3.0"
gson = "2.11.0"
junixsocket = "2.10.1"

[libraries]
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

springBoot-starter = { module = "org.springframework.boot:spring-boot-starter" }
springBoot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
springBoot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
springBoot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }

archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
assertj = { module = "org.assertj:assertj-core" }

[plugins]
springBoot = { id = "org.springframework.boot", version.ref = "springBoot" }
springDependencyManagement = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
